name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[server,coordinator,dev]"
      - run: python -m pytest --cov=src/evolving_soul --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[server,coordinator,dev]"
      - run: ruff check src tests_protocol integrations
      - run: ruff format --check src tests_protocol integrations
      - run: mypy src/evolving_soul
      - run: bandit -q -r src integrations
      - run: pip-audit
      - run: python -m build
      - name: Reproducible wheel check
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build --wheel --outdir dist-a
          python -m build --wheel --outdir dist-b
          test "$(sha256sum dist-a/*.whl | cut -d' ' -f1)" = "$(sha256sum dist-b/*.whl | cut -d' ' -f1)"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
