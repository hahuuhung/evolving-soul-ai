name: Evolving Soul AI - CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      EVOLVING_SOUL_MODEL_DIR: ${{ github.workspace }}/models
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 3. Cache model YuNet/SFace & ảnh mẫu (SHA-256 được kiểm tra khi dùng)
        uses: actions/cache@v4
        with:
          path: models
          key: face-models-${{ hashFiles('evolving_soul/biometrics.py', 'tests/test_biometrics.py') }}

      - name: 4. Cài đặt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Kiểm thử unit + E2E (gồm test dùng model thật)
        run: python -m pytest -v
