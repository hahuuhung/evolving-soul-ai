[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolving-soul-ai"
version = "3.0.0a1"
description = "Owner-bound, local-first continuity for personal AI memory."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Evolving Soul AI contributors" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=43,<51",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "webauthn>=2.2,<3",
  "authlib>=1.4,<2",
  "keyring>=25,<27",
]
coordinator = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "shamir-mnemonic>=0.3,<1",
]
demo = ["httpx>=0.27,<1"]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
soul = "evolving_soul.cli:main"
soul-coordinator = "evolving_soul.coordinator:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests_protocol"]
addopts = "--strict-markers"
markers = [
  "models: cần model ONNX YuNet/SFace (tự bỏ qua khi không có)",
  "slow: kiểm thử hiệu chỉnh FAR/FRR",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests_protocol", "integrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests_protocol/**" = ["S106"]
"src/evolving_soul/service.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["evolving_soul"]
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["authlib.*", "shamir_mnemonic", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
